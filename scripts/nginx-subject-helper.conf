# OCI vm-1-6: /etc/nginx/sites-available/subject-helper
# 메인: http://univref.152-69-239-29.sslip.io/
# HTTPS(인증서 이름 일치): https://152.69.239.29.nip.io/

server {
    listen 80;
    listen [::]:80;
    server_name univref.152-69-239-29.sslip.io univref.152.69.239.29.nip.io;

    location /.well-known/acme-challenge/ {
        root /home/ubuntu/acme-webroot;
    }

    client_max_body_size 32M;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name 152.69.239.29 152.69.239.29.nip.io;
    return 301 http://univref.152-69-239-29.sslip.io$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 152.69.239.29.nip.io;

    ssl_certificate /etc/letsencrypt/live/152.69.239.29.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/152.69.239.29.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32M;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 152.69.239.29 univref.152-69-239-29.sslip.io univref.152.69.239.29.nip.io;

    ssl_certificate /etc/letsencrypt/live/152.69.239.29.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/152.69.239.29.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 http://univref.152-69-239-29.sslip.io$request_uri;
}
